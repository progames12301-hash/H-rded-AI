<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HARDed AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#f5f5f5;font-family:Inter,Arial,sans-serif;height:100vh;display:flex}
.app{width:min(1050px,100%);height:100%;margin:auto;display:flex;flex-direction:column}
header{height:64px;border-bottom:1px solid #242424;display:flex;align-items:center;padding:0 20px;gap:12px}
.logo{width:36px;height:36px;border:1px solid #444;border-radius:9px;display:grid;place-items:center;font-weight:800}
.title{font-weight:700}.sub{color:#777;font-size:12px;margin-top:2px}
main{flex:1;overflow:auto;padding:24px 18px}
.message{max-width:820px;margin:0 auto 18px;display:flex}
.message.user{justify-content:flex-end}
.bubble{padding:13px 15px;border:1px solid #272727;border-radius:14px;line-height:1.5;white-space:pre-wrap}
.user .bubble{background:#151515}
.assistant .bubble{background:#0d0d0d}
.meta{font-size:11px;color:#666;margin:0 0 6px 3px}
.composer{border-top:1px solid #242424;padding:14px 18px 18px}
.row{max-width:820px;margin:auto;display:flex;gap:10px}
textarea{flex:1;resize:none;min-height:54px;max-height:180px;background:#101010;color:#fff;border:1px solid #303030;border-radius:12px;padding:14px;font:inherit;outline:none}
button{border:1px solid #3b3b3b;background:#eee;color:#080808;border-radius:12px;padding:0 20px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.settings{max-width:820px;margin:0 auto 10px;display:flex;gap:8px}
input{flex:1;background:#101010;color:#ddd;border:1px solid #303030;border-radius:9px;padding:9px}
.status{max-width:820px;margin:8px auto 0;color:#777;font-size:12px}
a{color:#aaa}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">H</div>
  <div><div class="title">HARDed AI</div><div class="sub">Llama 3.2 3B Q4_K_M · GitHub Actions</div></div>
</header>

<main id="chat">
  <div class="message assistant">
    <div>
      <div class="meta">HARDed</div>
      <div class="bubble">Olá. Sou o HARDed rodando no runner do GitHub. Envie uma mensagem para testar o modelo.</div>
    </div>
  </div>
</main>

<div class="composer">
  <div class="settings">
    <input id="token" type="password" placeholder="GitHub fine-grained token — fica somente nesta sessão">
  </div>
  <div class="row">
    <textarea id="prompt" placeholder="Digite sua mensagem..." rows="1"></textarea>
    <button id="send">Enviar</button>
  </div>
  <div id="status" class="status"></div>
</div>
</div>

<script>
const OWNER="progames12301-hash";
const REPO="H-rded-AI";
const WORKFLOW="harded-chat.yml";
const BRANCH="main";

const chat=document.getElementById("chat");
const promptBox=document.getElementById("prompt");
const tokenBox=document.getElementById("token");
const send=document.getElementById("send");
const status=document.getElementById("status");

let history=[];

function addMessage(role,text){
  const wrap=document.createElement("div");
  wrap.className="message "+role;
  wrap.innerHTML=`<div><div class="meta">${role==="user"?"Você":"HARDed"}</div><div class="bubble"></div></div>`;
  wrap.querySelector(".bubble").textContent=text;
  chat.appendChild(wrap);
  chat.scrollTop=chat.scrollHeight;
  return wrap;
}

async function api(path, options={}){
  const token=tokenBox.value.trim();
  if(!token) throw new Error("Informe um GitHub fine-grained token.");
  const res=await fetch("https://api.github.com"+path,{
    ...options,
    headers:{
      "Accept":"application/vnd.github+json",
      "Authorization":"Bearer "+token,
      "X-GitHub-Api-Version":"2026-03-10",
      ...(options.headers||{})
    }
  });
  if(!res.ok){
    const text=await res.text();
    throw new Error(`GitHub ${res.status}: ${text.slice(0,300)}`);
  }
  return res.status===204?null:res.json();
}

async function waitForRun(runId){
  for(let i=0;i<210;i++){
    const run=await api(`/repos/${OWNER}/${REPO}/actions/runs/${runId}`);
    status.textContent=`Executando no runner... ${run.status}${run.conclusion?" · "+run.conclusion:""}`;
    if(run.status==="completed") return run;
    await new Promise(r=>setTimeout(r,4000));
  }
  throw new Error("Tempo limite aguardando o runner.");
}

async function waitForResponse(runId){
  const url=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/responses/${runId}.json`;
  for(let i=0;i<120;i++){
    const res=await fetch(url+"?t="+Date.now(),{cache:"no-store"});
    if(res.ok){
      return await res.json();
    }
    await new Promise(r=>setTimeout(r,3000));
  }
  throw new Error("A resposta não apareceu no repositório.");
}

async function sendMessage(){
  const text=promptBox.value.trim();
  if(!text || send.disabled) return;

  if(!tokenBox.value.trim()){
    status.textContent="Informe o token do GitHub para disparar o Actions.";
    tokenBox.focus();
    return;
  }

  send.disabled=true;
  promptBox.value="";
  addMessage("user",text);

  const context=history.slice(-12);
  history.push({role:"user",content:text});
  status.textContent="Criando execução do HARDed...";

  try{
    const body={
      ref:BRANCH,
      inputs:{
        prompt:text,
        history:JSON.stringify(context)
      },
      return_run_details:true
    };

    const dispatch=await api(`/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,{
      method:"POST",
      body:JSON.stringify(body)
    });

    const runId=dispatch.workflow_run_id;
    if(!runId) throw new Error("GitHub não retornou o ID da execução.");

    await waitForRun(runId);
    const result=await waitForResponse(runId);

    const answer=result.answer || "O HARDed não retornou texto.";
    addMessage("assistant",answer);
    history.push({role:"assistant",content:answer});
    status.textContent=`Concluído · run #${runId}`;
  }catch(err){
    addMessage("assistant","Erro: "+err.message);
    status.textContent="Falha na execução.";
  }finally{
    send.disabled=false;
    promptBox.focus();
  }
}

send.addEventListener("click",sendMessage);
promptBox.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
</script>
</body>
</html>
