<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HARDed AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#242424;font-family:Inter,Arial,sans-serif;height:100vh}.app{height:100%;display:flex}.side{width:270px;background:#f7f7f5;border-right:1px solid #e4e4df;padding:14px;display:flex;flex-direction:column}.brand{font-family:Georgia,serif;font-size:23px;padding:8px 10px 20px}.nav{padding:10px;border-radius:9px;font-size:14px}.nav.active,.nav:hover{background:#e9e9e6}.section{font-size:11px;color:#888;padding:22px 10px 7px}.chatitem{padding:8px 10px;font-size:13px;border-radius:8px}.chatitem:hover{background:#ecece9}.bottom{margin-top:auto;border-top:1px solid #ddd;padding-top:12px}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.model{font-size:13px;color:#666}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d97745;margin-right:7px}.content{flex:1;overflow:auto;padding:30px 20px 145px}.inner{max-width:900px;margin:auto}.welcome{text-align:center;font:30px Georgia,serif;margin:65px 0 35px}.msg{margin:18px 0;display:flex}.msg.user{justify-content:flex-end}.bubble{max-width:650px;padding:13px 17px;border-radius:18px;background:#f0f0ed;white-space:pre-wrap;line-height:1.5}.assistant{max-width:760px;margin:auto}.thinking{border:1px solid #e4e4df;border-radius:12px;background:#fff;overflow:hidden}.th{padding:13px;border-bottom:1px solid #eee;font-size:13px;color:#666}.steps{padding:7px 12px}.step{padding:8px 2px;font-size:13px;color:#777}.step b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ccc;margin-right:9px}.step.active{color:#333}.step.active b{background:#d97745}.answer{padding:16px 3px;line-height:1.65;font-size:15px}.effort{font-size:12px;color:#777}.bars i{display:inline-block;width:15px;height:4px;background:#ddd;border-radius:3px;margin-left:3px}.bars i.on{background:#d97745}.composer{position:fixed;left:270px;right:0;bottom:0;background:linear-gradient(transparent,#fff 25%);padding:22px 25px}.compose{max-width:900px;margin:auto;border:1px solid #d8d8d3;border-radius:17px;background:#fff;box-shadow:0 3px 15px #0000000d;padding:10px}.settings{display:flex;gap:8px;padding:3px}.settings label{font-size:12px;color:#777;padding:10px 4px}.settings input{flex:1;border:1px solid #ddd;border-radius:9px;padding:9px;outline:0}.row{display:flex;gap:8px}.row textarea{flex:1;border:0;outline:0;resize:none;padding:10px;min-height:50px;font:inherit}.btn{border:0;border-radius:10px;padding:0 17px;background:#222;color:#fff}.status{font-size:11px;color:#888;padding:5px}.hidden{display:none}@media(max-width:760px){.side{display:none}.composer{left:0}.welcome{font-size:26px}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand">HARDed</div><div class="nav active">＋ Nova conversa</div><div class="nav">▱ Projetos</div><div class="nav">◇ Artefatos</div><div class="nav">‹› Código</div><div class="section">FIXADOS</div><div class="chatitem">HARDed AI</div><div class="chatitem">Sideral meteorologia</div><div class="section">CONVERSAS</div><div class="chatitem">Criando HTML com planejamento</div><div class="chatitem">Otimização de workflow</div><div class="bottom">HARDed · Experimental</div></aside>
<main class="main"><header class="top"><strong>HARDed AI</strong><div class="model"><span class="dot"></span>Llama 3.2 3B · Q4</div></header><section class="content" id="content"><div class="inner"><div class="welcome">Boa tarde, vamos trabalhar?</div><div id="messages"></div></div></section></main>
<div class="composer"><div class="compose"><div class="settings"><label>Token=</label><input id="token" type="password" value="" placeholder="cole seu GitHub token aqui" autocomplete="off"><button class="btn" id="start">Iniciar</button></div><div class="row"><textarea id="prompt" placeholder="Escreva uma mensagem para o HARDed..."></textarea><button class="btn" id="send" disabled>↑</button></div><div class="status" id="status">Sessão não iniciada.</div></div></div>
</div>
<script>
const OWNER="progames12301-hash",REPO="H-rded-AI",WORKFLOW="jekyll-docker.yml",BRANCH="main";
const token=document.getElementById('token'),start=document.getElementById('start'),send=document.getElementById('send'),prompt=document.getElementById('prompt'),messages=document.getElementById('messages'),status=document.getElementById('status'),content=document.getElementById('content');let active=false,history=[];
async function api(path,opt={}){const t=token.value.trim();if(!t)throw Error('Preencha Token= antes de iniciar.');const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2026-03-10',...(opt.headers||{})}});if(!r.ok)throw Error('GitHub '+r.status+': '+(await r.text()).slice(0,250));return r.status===204?null:r.json()}
function add(role,text){const el=document.createElement('div');el.className='msg '+role;el.innerHTML='<div><div style="font-size:11px;color:#888;margin:0 0 5px 4px">'+(role==='user'?'Você':'HARDed')+'</div><div class="bubble"></div></div>';el.querySelector('.bubble').textContent=text;messages.appendChild(el);content.scrollTop=content.scrollHeight}
function thinking(){const el=document.createElement('div');el.className='assistant';el.innerHTML='<div class="thinking"><div class="th">● Trabalhando na resposta <span style="float:right">processando</span></div><div class="steps"><div class="step active"><b></b>Entendendo a solicitação</div><div class="step"><b></b>Analisando contexto e histórico</div><div class="step"><b></b>Construindo a resposta</div><div class="step"><b></b>Verificando o resultado</div></div></div>';messages.appendChild(el);let n=0,steps=el.querySelectorAll('.step');const timer=setInterval(()=>{steps.forEach((x,i)=>x.classList.toggle('active',i===n));if(n<steps.length-1)n++},1800);return {el,timer}}
function finish(t,text){clearInterval(t.timer);t.el.querySelector('.thinking').innerHTML='<div class="th">✓ Trabalho concluído</div>';const a=document.createElement('div');a.className='answer';a.textContent=text;t.el.appendChild(a);const e=document.createElement('div');e.className='effort';e.innerHTML='Esforço utilizado <span class="bars"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span>';t.el.appendChild(e)}
async function getFile(path){try{return await api(`/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`)}catch(e){if(String(e).includes('404'))return null;throw e}}
function decode(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}function encode(s){return btoa(unescape(encodeURIComponent(s)))}
async function put(path,data,sha,msg){const body={message:msg,content:encode(JSON.stringify(data,null,2)),branch:BRANCH};if(sha)body.sha=sha;return api(`/repos/${OWNER}/${REPO}/contents/${path}`,{method:'PUT',body:JSON.stringify(body)})}
start.onclick=async()=>{start.disabled=true;status.textContent='Iniciando runner...';try{await api(`/repos/${OWNER}/${REPO}/actions/workflows/${encodeURIComponent(WORKFLOW)}/dispatches`,{method:'POST',body:JSON.stringify({ref:BRANCH})});active=true;send.disabled=false;status.textContent='Runner solicitado · carregando Llama 3.2 3B.'}catch(e){status.textContent=e.message;start.disabled=false}};
send.onclick=async()=>{const text=prompt.value.trim();if(!text||!active)return;prompt.value='';add('user',text);const t=thinking();send.disabled=true;status.textContent='Enviando...';const id=Date.now().toString(36);try{const old=await getFile('chat/queue.json');let data=[],sha;if(old){data=JSON.parse(decode(old.content));sha=old.sha}data.push({id,prompt:text,history:history.slice(-12),done:false,created_at:new Date().toISOString()});await put('chat/queue.json',data,sha,'HARDed: new message '+id);history.push({role:'user',content:text});for(let i=0;i<300;i++){const f=await getFile('chat/queue.json');if(f){const d=JSON.parse(decode(f.content)),x=d.find(v=>v.id===id);if(x&&x.done){finish(t,x.answer||'Sem resposta.');history.push({role:'assistant',content:x.answer||''});status.textContent='HARDed online · resposta concluída.';send.disabled=false;return}}await new Promise(r=>setTimeout(r,3000))}finish(t,'Tempo limite aguardando o runner. Verifique o GitHub Actions.')}catch(e){clearInterval(t.timer);t.el.querySelector('.th').textContent='Erro: '+e.message;status.textContent=e.message}send.disabled=false};
prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.click()}});
</script></body></html>
