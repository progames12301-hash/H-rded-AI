name: HARDed AI - Persistent Chat

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harded-persistent-chat
  cancel-in-progress: false

jobs:
  harded:
    name: HARDed persistent Llama 3.2 3B
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      MODEL_REPO: bartowski/Llama-3.2-3B-Instruct-GGUF
      MODEL_FILE: Llama-3.2-3B-Instruct-Q4_K_M.gguf
      QUEUE: chat/queue.json
      RESPONSES: chat/responses

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar runner
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y cmake build-essential curl jq python3
          echo "CPU: $(nproc)"
          free -h
          df -h /

      - name: Compilar llama.cpp
        run: |
          set -e
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$HOME/llama.cpp"
          cmake -S "$HOME/llama.cpp" -B "$HOME/llama.cpp/build" \
            -DGGML_NATIVE=ON -DGGML_OPENMP=ON
          cmake --build "$HOME/llama.cpp/build" \
            --config Release --target llama-server -j"$(nproc)"

      - name: Cache do modelo
        uses: actions/cache@v4
        with:
          path: models
          key: harded-llama32-3b-q4km-v1

      - name: Baixar modelo
        run: |
          set -e
          mkdir -p models
          if [ ! -f "models/$MODEL_FILE" ]; then
            curl -L --fail --retry 5 --retry-delay 3 \
              "https://huggingface.co/$MODEL_REPO/resolve/main/$MODEL_FILE?download=true" \
              -o "models/$MODEL_FILE"
          fi
          ls -lh "models/$MODEL_FILE"

      - name: Inicializar fila
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p chat/responses
          printf '[]\n' > chat/queue.json
          git config user.name "HARDed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat/queue.json
          git diff --cached --quiet || git commit -m "HARDed: initialize chat queue"
          git push || true

      - name: Iniciar Llama 3.2 3B
        run: |
          "$HOME/llama.cpp/build/bin/llama-server" \
            -m "models/$MODEL_FILE" \
            --alias harded-llama-3.2-3b \
            --host 127.0.0.1 \
            --port 8080 \
            -c 4096 \
            -t "$(nproc)" \
            -ngl 0 \
            > /tmp/llama.log 2>&1 &

          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "HARDed pronto."
              exit 0
            fi
            sleep 2
          done

          cat /tmp/llama.log
          exit 1

      - name: Iniciar loop persistente do HARDed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/harded

          python3 - <<'PY'
          import json, os, subprocess, time, urllib.request, urllib.parse

          repo=os.environ["GITHUB_REPOSITORY"]
          queue_path="chat/queue.json"
          token=os.environ["GH_TOKEN"]
          processed=set()

          def api(url, method="GET", data=None):
              req=urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept":"application/vnd.github+json",
                      "Authorization":f"Bearer {token}",
                      "X-GitHub-Api-Version":"2026-03-10"
                  })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def read_queue():
              url=f"https://api.github.com/repos/{repo}/contents/{queue_path}?ref=main"
              obj=api(url)
              raw=__import__("base64").b64decode(obj["content"]).decode()
              return json.loads(raw), obj["sha"]

          def git_sync():
              subprocess.run(["git","fetch","origin","main"],check=False,
                             stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              subprocess.run(["git","reset","--hard","origin/main"],check=False,
                             stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          def answer(item):
              prompt=item["prompt"]
              history=item.get("history",[])
              messages=[
                  {"role":"system","content":
                   "Você é HARDed, uma IA de programação objetiva. "
                   "Responda em português quando o usuário falar português. "
                   "Não invente resultados ou arquivos."}
              ]
              for m in history[-12:]:
                  if m.get("role") in ("user","assistant"):
                      messages.append({"role":m["role"],"content":m["content"]})
              messages.append({"role":"user","content":prompt})

              payload=json.dumps({
                  "model":"harded-llama-3.2-3b",
                  "messages":messages,
                  "temperature":0.2,
                  "top_p":0.9,
                  "max_tokens":1024,
                  "stream":False
              }).encode()

              req=urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=payload,
                  headers={"Content-Type":"application/json"}
              )
              with urllib.request.urlopen(req,timeout=900) as r:
                  return json.load(r)["choices"][0]["message"]["content"]

          print("HARDed permanece ativo e aguardando mensagens.")

          # O runner fica vivo, mantendo o modelo carregado.
          # A interface web adiciona mensagens à fila no repositório.
          for cycle in range(19800):  # ~11 horas, limitado também pelo job timeout
              try:
                  queue, sha=read_queue()
                  new_items=[x for x in queue if x.get("id") not in processed and not x.get("done")]

                  for item in new_items:
                      rid=str(item["id"])
                      print(f"Processando mensagem {rid}...")
                      try:
                          text=answer(item)
                          status="completed"
                      except Exception as e:
                          text=f"Erro ao gerar resposta: {e}"
                          status="failed"

                      item["done"]=True
                      item["status"]=status
                      item["answer"]=text

                      # Atualiza a fila através do GitHub API.
                      encoded=__import__("base64").b64encode(
                          json.dumps(queue,ensure_ascii=False,indent=2).encode()
                      ).decode()

                      body=json.dumps({
                          "message":f"HARDed response {rid}",
                          "content":encoded,
                          "sha":sha,
                          "branch":"main"
                      }).encode()

                      req=urllib.request.Request(
                          f"https://api.github.com/repos/{repo}/contents/{queue_path}",
                          data=body, method="PUT",
                          headers={
                              "Accept":"application/vnd.github+json",
                              "Authorization":f"Bearer {token}",
                              "X-GitHub-Api-Version":"2026-03-10",
                              "Content-Type":"application/json"
                          })
                      with urllib.request.urlopen(req,timeout=30):
                          pass

                      processed.add(rid)
                      sha=api(
                          f"https://api.github.com/repos/{repo}/contents/{queue_path}?ref=main"
                      )["sha"]

              except Exception as e:
                  print("Loop:",e)

              time.sleep(4)

          print("Janela do runner encerrada.")
          PY

      - name: Log
        if: always()
        run: |
          tail -100 /tmp/llama.log 2>/dev/null || true
